  config-version: 100

# /********************************************/
#    Global settings
# /********************************************/

# Plugin language selection. Possible values:  EN, PL, ES, FR, DE
# If you would like to add your own language file, please contact us on Discord (https://discord.gg/Zk6mxv7eMh).
language: "EN"

# /********************************************/
#    Settings for connecting to the database
# /********************************************/
database:
  # Available options: mariadb, mysql, postgresql, sqlite, h2
  type: "sqlite"
  sql:
    host: "localhost"
    port: 3306 # 5432 if you use PostgreSQL default for MySQL is 3306
    dbname: "my_database"
    username: "root"
    password: "password"

# Plots settings
plots:
  # Maximum plots across ALL worlds; override with plotsx.plot.max-plots.<number>.
  # Highest granted numeric permission wins; without one, this value is used.
  maxPlots: 5
  # Initial radius; override with plotsx.plot.radius.<radius> (e.g. VIP: 24).
  # Still subject to maximum radius and combined area limits below.
  radius: 16
  # Allowed loaded worlds, including worlds loaded by Multiverse-Core.
  # A legacy single string is also supported. ["*"] = all worlds; [] = none.
  world: ["world"]
  expansion:
    # Sequential upgrades from level 0. step adds blocks to EACH border.
    # price is per upgrade in the default economy currency; 0 = free.
    # Missing next level means maximum level reached.
    levels:
      1:
        step: 8
        price: 500.0
      2:
        step: 8
        price: 1000.0
      3:
        step: 16
        price: 2000.0
    # Used when the player has no plotsx.plot.size.<radius> permission
    defaultMaxRadius: 64
    # Combined block area of all owned plots; override with plotsx.plot.max-area.<blocks>
    defaultMaxTotalArea: 16641

# Private containers (chests, trapped chests, barrels and shulker boxes)
privateChests:
  # Automatically assign newly placed containers to the player who placed them.
  # Existing containers can be protected with /privatechest lock.
  protectOnPlace: false

# Default grants; owners can override each grant per plot in /plot members.
# Hierarchy: member < builder < manager. Only owner/admin assigns ranks.
# Supported grants: invite, kick, rename, flag.<registered flag name>.
# Publication reference: docs/wiki/Ochrona-i-flagi.md (flags and role grants).
plot-roles:
  member:
    permissions: []
  builder:
    permissions: []
  manager:
    permissions: [invite, kick, rename]

# /********************************************/
#    Settings for main commands
# /********************************************/

# You can set your own aliases for the commands below
aliases:
  claim: "c"
  unclaim: "unc"


# /********************************************/
#    Internal settings
# /********************************************/

# Discord webhook settings
webhook:
  discord:
    enabled: false
    url: "YOUR_WEBHOOK_URL_HERE"

  # Update check and auto-download settings.
update:
  check-for-updates: true
  auto-download: false
  hangar: true
  github: true
  modrinth: true

  # Debug mode provides more detailed console logs.
  # Debug level: off | info | diag | dev
debug: off

  # Should StatsCollector be enabled? Recommended: true.
stats:
  enabled: true