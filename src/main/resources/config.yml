config-version: 100

# /********************************************/
#    Global settings
# /********************************************/

# Plugin language selection. Bundled values: EN, PL
# If you would like to add your own language file, please contact us on Discord (https://discord.gg/Zk6mxv7eMh).
language: "EN"

# auto: native text-entry dialogs when the server provides the Paper Dialog API; legacy: text entry through chat.
interactions:
  mode: auto
  # Set true only when you intentionally need chat fallback for translated/legacy clients.
  # Installing ViaVersion, ViaBackwards or Geyser no longer disables dialogs globally.
  translated-clients: false

# /********************************************/
#    Settings for connecting to the database
# /********************************************/
database:
  # Available options: mariadb, mysql, postgresql, sqlite, h2
  type: "sqlite"
  sql:
    host: "localhost"
    port: 3306 # 5432 if you use PostgreSQL default for MySQL is 3306
    dbname: "my_database"
    username: "root"
    password: "password"

# Plots settings
plots:
  # Selects NEW claims only. Existing plots keep their geometry and protection.
  # Changes require a server restart. Supported values: classic | chunks.
  claiming:
    mode: classic
  chunks:
    # Maximum chunks in one chunk plot; raise it for selected players with
    # plotsx.plot.max-chunks-per-plot.<number>.
    maxPerPlot: 32
    # Maximum chunks owned across all chunk plots and worlds; raise it with
    # plotsx.plot.max-chunks.<number>.
    # The highest granted value or this configured baseline wins. For chunk plots,
    # the effective total-area limit is raised automatically so this count is reachable.
    maxTotalOwned: 64
    expansion:
      # Price per additional chunk; the first claimed chunk remains free.
      price: 500.0
      priceMultiplier: 1.5
      # Maximum price of a single additional chunk after applying priceMultiplier.
      # -1 = unlimited; 0 makes every additional chunk free.
      maxPrice: -1
      # Allow /plot expand while standing on a free chunk adjacent to your chunk plot.
      # The command skips direction selection and opens the purchase confirmation directly.
      standingCommand: true
  # Maximum plots across ALL worlds; override with plotsx.plot.max-plots.<number>.
  # Highest granted numeric permission wins; without one, this value is used.
  maxPlots: 5
  # Initial radius for NEW classic plots only; it does not affect chunk plots.
  # Override with plotsx.plot.radius.<radius> (e.g. VIP: 24).
  # Classic plots remain subject to maximum radius and combined area limits below.
  radius: 16
  # Allowed loaded worlds, including worlds loaded by Multiverse-Core.
  # A legacy single string is also supported. ["*"] = all worlds; [] = none.
  world: ["world"]
  # Duration of Show borders in the plot and expansion menus (seconds, minimum 1).
  borderDisplaySeconds: 30
  notifications:
    # Where approaching, entering and leaving plot notices appear: actionbar | chat.
    boundary: actionbar
  expansion:
    # Classic plots only. Chunk expansion uses plots.chunks.expansion above.
    # Stand in the segment from which you want to expand; select an adjacent direction.
    # Each purchase adds one square of the plot's original size in the selected direction.
    # Base price of the first segment in the default economy currency; 0 = free.
    price: 500.0
    # Next price = price * priceMultiplier ^ purchased segment count (per plot).
    # Must be >= 1; 1 disables growth. Example: 500, 750, 1125, ...
    priceMultiplier: 1.5
    # Maximum price of one expansion after applying priceMultiplier.
    # -1 = unlimited; 0 makes every expansion free.
    maxPrice: -1
    # Used when the player has no plotsx.plot.size.<radius> permission
    defaultMaxRadius: 64
    # Combined block area of all owned plots; override with plotsx.plot.max-area.<blocks>
    defaultMaxTotalArea: 16641

# Private containers (chests, trapped chests, barrels and shulker boxes)
privateChests:
  # Automatically assign newly placed containers to the player who placed them.
  # Existing containers can be protected with /privatechest lock.
  protectOnPlace: false

# Default grants; owners can override each grant per plot in /plot members.
# Hierarchy: member < builder < manager. Only owner/admin assigns ranks.
# Supported grants: invite, kick, rename, flag.<registered flag name>.
# Publication reference: docs/wiki/Ochrona-i-flagi.md (flags and role grants).
plot-roles:
  member:
    permissions: []
  builder:
    permissions: []
  manager:
    permissions: [invite, kick, rename]

# /********************************************/
#    Settings for main commands
# /********************************************/

# You can set your own aliases for the commands below
aliases:
  claim: "c"
  unclaim: "unc"


# /********************************************/
#    Internal settings
# /********************************************/

# Discord webhook settings
webhook:
  discord:
    enabled: false
    url: "YOUR_WEBHOOK_URL_HERE"

  # Update check and auto-download settings.
update:
  check-for-updates: true
  auto-download: false
  hangar: true
  github: true
  modrinth: true

  # Debug mode provides more detailed console logs.
  # Debug level: off | info | diag | dev
debug: off

  # Should StatsCollector be enabled? Recommended: true.
stats:
  enabled: true
