# Formatowanie tekstów wiadomości:
# Można używać formatowania MiniMessage oraz Legacy (Minecraft).
# Przykłady jak stosować MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Nie mieszaj formatów w jednej wiadomości. Jeśli używasz Legacy, nie wstawiaj formatowania MiniMessage, w przeciwnym wypadku zostanie użyty tylko ten drugi.

prefix: "<gradient:#11ff00:#d4ffde:#70e672:#d4ffde:#11ff00>[<b>PlotsX</b>]</gradient>"

# Wiadomości obsługi błędów
error:
  no_permission: "<red>Nie masz uprawnień do tej komendy.</red>"
  claim_not_found: "<gold>Nie znaleziono gracza o nicku {player}.</gold>" ## WTF? Co tu autor miał na myśli?
  not_owner: "<red>Nie możesz ingerować w tą działkę, ponieważ nie jesteś jej właścicielem.</red>"
  there_is_no_plot: "<red>Nie ma działki w tej lokalizacji.</red>"
  is_plot: "<red>Nie możesz postawić działki tutaj, ponieważ działka już istnieje.</red>"
  no_in_plot: "<red>Nie jesteś w działce.</red><grey>Użyj /plot <nazwa>, aby wybrać działkę lub stań na swojej działce.</grey>"
  in_collision: "<red>Nie możesz postawić działki tutaj, ponieważ koliduje z inną działką.</red>"
  create_error: "<red>Wystąpił błąd podczas tworzenia działki.</red"

  console: "<red>Tylko gracz może użyć tej komendy</red>"
  reload: "<red>Wystąpił błąd podczas przełądowania konfiguracji:</red> "

plots:
  claim_success: "<green>Działka została pomyślnie ustawiona!</green>"
  unclaim_success: "<green>Działka została pomyślnie usunięta.</green>"
  enter_plot: "<green>Wszedłeś na działkę <white>{plot}</white></green>"
  leave_plot: "<green>Opuszczono działkę <white>{plot}</white></green>"


