  iceform-player:
    name: "Player Ice Creation"
    description: "Allows players to create ice (e.g., Frost Walker)"
  iceform-world:
    name: "World Ice/Snow Creation"
    description: "Allows snow golems, weather, and other sources to form ice/snow"
  allow-fly:
    name: "Allow Flying"
    description: "Allows flying in the region"
  teleport:
    name: "Teleportation Blocking"
    description: "Blocks teleportation with pearls and chorus fruit"
  cant-grow:
    name: "Plant Growth"
    description: "Prevents crop and plant growth"
  allow-spawners:
    name: "Spawner Access"
    description: "Allows non-members to place and break spawners"
