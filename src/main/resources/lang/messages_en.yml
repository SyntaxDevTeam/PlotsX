# Ver. 1.0.0
# Author: WieszczY
# Message text formatting:
# You can use MiniMessage or Legacy (Minecraft) formatting.
# Examples on how to use MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Do not mix formats in a single message. If you use Legacy, do not insert MiniMessage formatting, otherwise only MiniMessage will be used.

prefix: "<gradient:#11ff00:#d4ffde:#70e672:#d4ffde:#11ff00>[<b>PlotsX</b>]</gradient>"

# Error messages
error:
  no_permission: "<red>You don't have permission to use this command.</red>"
  claim_not_found: "<gold>No player found with the nickname {player}.</gold>" # Unclear message in PL, kept literal
  not_owner: "<red>You cannot interact with this plot because you are not the owner.</red>"
  there_is_no_plot: "<red>There is no plot in this location.</red>"
  is_plot: "<red>You can't claim here because a plot already exists.</red>"
  no_in_plot: "<red>You are not inside a plot.</red><grey>Use /plot <name> to select a plot or stand on your plot.</grey>"
  in_collision: "<red>You can't claim here because it overlaps with another plot.</red>"
  create_error: "<red>An error occurred while creating the plot.</red>"
  no_plot_found: "<red>You do not own any plots.</red>"
  plot_not_found: "<red>Plot not found.</red>"


  console: "<red>Only players can use this command.</red>"
  reload: "<red>An error occurred while reloading the configuration:</red> "

plots:
  claim_success: "<green>Plot has been successfully created!</green>"
  unclaim_success: "<green>Plot has been successfully removed.</green>"
  enter_plot: "<green>You entered plot <white>{plot}</white></green>"
  leave_plot: "<green>You left plot <white>{plot}</white></green>"
  teleport: "<green>Teleported to the plot!</green>"
  teleport_failed: "<red>No safe location found to teleport to this plot.</red>"
  rename_hint: "Type the new plot name in chat (you have 60 seconds)."
  rename_timeout: "<red>Time to enter a new name has expired. Process cancelled.</red>"
  rename_success: "<green>Plot name changed to: <white>{name}</white></green>"
  rename_exists: "<red>A plot with this name already exists!</red>"
  rename_not_found: "<red>Plot not found.</red>"
  rename_fail: "<red>Failed to change the plot name.</red>"

GUI:
  claim:
    title_claim: "Confirm plot creation!"
    material_name:
      confirm: "<green>Create plot</green>"
      cancel: "<red>Cancel</red>"
  plot:
    title_plot: "<b>Plot Settings"
    material_name:
      info: "<gold><bold>Plot Information</bold></gold>"
      flags: "<color:#852579>Flag Settings</color>"
      teleport: "<color:#aa2244>Teleport to plot</color>"
      list: "<gold>Plot List</gold>"
      rename: "<gold>Rename Plot</gold>"
      expand: "<gold>Expand Plot</gold>"
    info:
      owner: "<green>Owner:</green> <white>{owner}</white>"
      plot_name: "<green>Name:</green> <white>{plot}"
      id: "<green>ID:</green> <white>{id}"
      creation_time: "<green>Created:</green> <white>{time}"
      click: "<white>Click to see boundaries</white>"
    list_title: "<b>Your plot list:</b>"
    list_click_hint: "<gray>Click to open plot options</gray>"
  flags:
    title: "<b>Flag Settings</b>"
    back: "<gray>Back to plot settings</gray>"

flags:
  desc_title: "Description: "
  value_title: "Value: "
  value_true: "Enabled"
  value_false: "Disabled"
  toggle: "<gray>Flag <white>{flag}</white> set to <white>{value}</white></gray>"
  build:
    name: "Build Permission"
    description: "Allows non-members to place and break blocks"
    not_allowed: "<red>You can't place blocks on this plot.</red>"
    break_not_allowed: "<red>You can't break blocks on this plot.</red>"
  pvp:
    name: "PvP Permission"
    description: "Blocks damage from players and their weapons"
    not_allowed: "<red>You can't attack players on this plot.</red>"
  chest:
    name: "Chest Access"
    description: "Blocks chest access for non-members"
    not_allowed: "<red>You can't open chests on this plot.</red>"
  ender-chest:
    name: "Ender Chest Access"
    description: "Blocks Ender chest access for non-members"
    not_allowed: "<red>You can't open Ender chests on this plot.</red>"
  lever:
    name: "Lever Use"
    description: "Blocks use of levers and redstone mechanisms"
    not_allowed: "<red>You can't use levers on this plot.</red>"
  button:
    name: "Button Use"
    description: "Blocks use of wooden and stone buttons"
