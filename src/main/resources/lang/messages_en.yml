  leaves-decay:
    name: "Leaf Decay"
    description: "Prevents leaves from decaying"
  effects:
    name: "Effect Blocking"
    description: "Blocks effects (including potions)"
  redstone:
    name: "Redstone Use"
    description: "Allows non-members to use redstone (excluding levers, buttons, and pressure plates)"
